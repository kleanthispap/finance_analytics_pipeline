xero_analytics:
  target: dev
  outputs:

    dev:
      type: bigquery
      method: oauth
      project: xero-finance-analytics-kp
      dataset: xero_analytics
      location: EU
      threads: 4
      job_execution_timeout_seconds: 300
      job_retries: 1

    ci:
      type: bigquery
      method: service-account
      keyfile: "{{ env_var('GCP_KEYFILE_PATH') }}"
      project: xero-finance-analytics-kp
      dataset: xero_analytics_ci
      location: EU
      threads: 4
      job_execution_timeout_seconds: 300
      job_retries: 1